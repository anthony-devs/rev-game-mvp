<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>REV Games · Insights</title>
<style>
  :root{--bg:#0b0b0d;--panel:#141417;--panel2:#1b1b1f;--line:#2a2a30;--text:#f2f2f4;--dim:#9a9aa5;--green:#2ee59d;--red:#ff6b6d;--gold:#ffc83d;--blue:#5aa9ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  h1{font-size:16px;margin:0} h1 b{color:var(--gold)} h2{margin:0 0 8px;font-size:15px} h3{font-size:12px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin:16px 0 6px}
  input,select,textarea,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  button{cursor:pointer} button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--green);color:#04170f;border-color:var(--green);font-weight:700}
  button.small{padding:3px 9px;font-size:12px}
  a{color:var(--blue);text-decoration:none}
  .spacer{flex:1}
  nav{display:flex;gap:6px;padding:12px 18px 0;flex-wrap:wrap;max-width:1300px;margin:0 auto}
  nav button.on{background:var(--gold);color:#201700;border-color:var(--gold);font-weight:700}
  main{padding:14px 18px;max-width:1300px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .kv{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--dim)} .kv b{display:block;font-size:20px;color:var(--text);margin-top:2px}
  .pos{color:var(--green)!important} .neg{color:var(--red)!important}
  table{width:100%;border-collapse:collapse;font-size:13px} td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} th{color:var(--dim);font-weight:600;font-size:12px}
  .s{color:var(--dim);font-size:12px}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line)}
  .open{color:var(--red);border-color:var(--red)} .resolved{color:var(--green);border-color:var(--green)} .ignored{color:var(--dim)}
  .warn{background:#2a2205;border:1px solid var(--gold);color:var(--gold);padding:8px 10px;border-radius:10px;margin-bottom:10px;font-size:12px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;display:none;z-index:9}
  .toast.err{border-color:var(--red);color:var(--red)}
  label{display:block;margin:10px 0 4px;color:var(--dim);font-size:12px}
  pre{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;max-height:220px;overflow:auto;margin:6px 0}
  .row{padding:9px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:var(--panel2)}
  svg text{fill:var(--dim);font-size:10px} .two svg text{font-size:14px}

  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}
  .kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
  .kpi .l{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
  .kpi .v{font-size:26px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}
  .kpi .d{font-size:12px;color:var(--dim)}
  .kpi svg{position:absolute;right:0;bottom:0;opacity:.9}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:13px;color:var(--dim)}
  .seg button.on{background:var(--gold);color:#201700;font-weight:700}
  .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;min-width:70px} .bar i{display:block;height:100%;background:var(--blue)}
  .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--dim);margin:2px 0 6px} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  td.n,th.n{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums} tr.hl td{background:#1b1b1f}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .bar+.s{margin-top:3px}

  #bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold),var(--green));z-index:20;opacity:0;transition:width .25s ease,opacity .25s ease;pointer-events:none}
  #bar.on{opacity:1}
  .skel{background:linear-gradient(100deg,var(--panel2) 30%,#26262b 50%,var(--panel2) 70%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:12px}
  @keyframes sh{to{background-position:-200% 0}}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes rot{to{transform:rotate(360deg)}}
  #view{transition:opacity .15s ease} #view.stale{opacity:.55;pointer-events:none}
  .fade{animation:fin .25s ease} @keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .errbox{background:#2a0f10;border:1px solid var(--red);border-radius:14px;padding:18px;text-align:center}
  .errbox b{display:block;font-size:16px;margin-bottom:4px} .errbox p{margin:0 0 12px;color:var(--dim)}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(46,229,157,.6);animation:pulse 2s infinite}
  .live.off i{background:var(--dim);animation:none} @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(46,229,157,0)}100%{box-shadow:0 0 0 0 rgba(46,229,157,0)}}
  .toast{display:block!important;opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .2s,transform .2s} .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.ok{border-color:var(--green);color:var(--green)}
  button.busy{opacity:.7;cursor:progress}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  tr:hover td{background:#17171a}
</style>
</head>
<body>
<div id="bar"></div>
<header>
  <h1>REV <b>Games</b> · Insights</h1>
  <span class="spacer"></span>
  <span id="status" class="live" title="Press R to refresh"><i></i><span>Live</span></span>
  <a href="/admin/payments">Payout desk</a><a href="/admin">← Moderation</a>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<div id="toast" class="toast"></div>
<!-- click-guard:start -->
<script>
/* Click guard: a button that starts a change is locked until the answer is back plus a short cool-off,
   and an identical change sent twice while the first is still running is sent only once. */
(function () {
  if (window.__clickGuard) return;
  window.__clickGuard = true;
  var COOL = 1000, WINDOW = 4000, inflight = {}, lastBtn = null, lastClick = 0, realFetch = window.fetch.bind(window);
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button, [role=button], input[type=submit]') : null;
    if (!b) return;
    if (b.getAttribute('data-guard') === '1') { e.preventDefault(); e.stopImmediatePropagation(); return; }
    lastBtn = b; lastClick = Date.now();
  }, true);
  function lock(b) {
    if (!b || !b.isConnected || b.getAttribute('data-guard') === '1') return;
    b.setAttribute('data-guard', '1'); b._wasDisabled = b.disabled; b.disabled = true;
    b.setAttribute('aria-busy', 'true'); b.style.opacity = '.6'; b.style.cursor = 'progress';
  }
  function unlock(b) {
    if (!b || b.getAttribute('data-guard') !== '1') return;
    b.removeAttribute('data-guard'); b.disabled = !!b._wasDisabled; b.removeAttribute('aria-busy'); b.style.opacity = ''; b.style.cursor = '';
  }
  window.fetch = function (input, init) {
    init = init || {};
    var method = String(init.method || (input && input.method) || 'GET').toUpperCase();
    if (method === 'GET' || method === 'HEAD' || method === 'OPTIONS') return realFetch(input, init);
    var url = typeof input === 'string' ? input : (input && input.url) || String(input);
    var key = typeof init.body === 'string' || init.body == null ? method + ' ' + url + ' ' + (init.body || '') : null;
    if (key && inflight[key]) return inflight[key].then(function (r) { return r.clone(); }); // same change already running: share its answer
    var btn = Date.now() - lastClick < WINDOW ? lastBtn : null;
    lock(btn);
    var p = realFetch(input, init), master = null;
    if (key) { master = p.then(function (r) { return r.clone(); }); master.catch(function () {}); inflight[key] = master; }
    var done = function () { setTimeout(function () { if (key && inflight[key] === master) delete inflight[key]; unlock(btn); }, COOL); };
    p.then(done, done);
    return p;
  };
})();
</script>
<!-- click-guard:end -->
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ss = k => { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } };
const TOKEN = ss('staffToken'), KEY = ss('adminKey');
if (!TOKEN || !KEY) location.replace('/admin');
let CUR = 'NGN';

// ---- feedback: progress bar, toasts, request handling
let pending = 0, barTimer;
function progress(delta) {
  pending = Math.max(0, pending + delta); const bar = $('#bar');
  if (pending > 0) { clearTimeout(barTimer); bar.classList.add('on'); bar.style.width = '70%'; }
  else { bar.style.width = '100%'; barTimer = setTimeout(() => { bar.classList.remove('on'); bar.style.width = '0'; }, 250); }
}
function toast(m, err) {
  const t = $('#toast'); t.textContent = (err === 'ok' ? '✓ ' : '') + m; t.className = 'toast show' + (err === true ? ' err' : err === 'ok' ? ' ok' : '');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), err === true ? 6000 : 3000);
}
const FRIENDLY = e => e.name === 'AbortError' ? 'The server took too long to answer. Try again.' : (e instanceof TypeError ? "Can't reach the server. Check that it is running." : e.message);
let TAB_CTRL = new AbortController();
async function api(path, body, opts = {}) {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), opts.timeout || 30000);
  const stop = () => ctrl.abort(); TAB_CTRL.signal.addEventListener('abort', stop, {once: !0});
  progress(1);
  try {
    const res = await fetch(path, {method: body === undefined ? 'GET' : 'POST', signal: ctrl.signal, headers: {'Authorization': 'Bearer ' + TOKEN, 'X-Admin-Key': KEY, 'Content-Type': 'application/json'}, body: body === undefined ? undefined : JSON.stringify(body)});
    const d = await res.json().catch(() => ({}));
    if (!res.ok) { if (res.status === 401) location.replace('/admin'); throw new Error(d.message || 'Something went wrong (' + res.status + ').'); }
    return d;
  } catch (e) { throw Object.assign(new Error(FRIENDLY(e)), {name: e.name}); }
  finally { clearTimeout(timer); TAB_CTRL.signal.removeEventListener('abort', stop); progress(-1); }
}
/** Runs a button action with a spinner, a toast for the result, and no double clicks. */
async function act(btn, busyText, fn, okText) {
  if (!btn || btn.classList.contains('busy')) return;
  const old = btn.innerHTML; btn.classList.add('busy'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + busyText;
  try { const r = await fn(); if (okText) toast(okText, 'ok'); return r; }
  catch (e) { if (e.name !== 'AbortError' || !TAB_CTRL.signal.aborted) toast(e.message, true); }
  finally { if (btn.isConnected) { btn.classList.remove('busy'); btn.disabled = false; btn.innerHTML = old; } }
}
const skel = (h, w = '100%') => `<div class="skel" style="height:${h}px;width:${w}"></div>`;
const SKELETON = `<div class="grid" style="margin-bottom:14px">${[1, 2, 3, 4].map(() => skel(96)).join('')}</div><div class="grid" style="margin-bottom:14px">${[1, 2, 3, 4].map(() => skel(60)).join('')}</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">${skel(190)}${skel(190)}</div><div style="margin-top:14px">${skel(220)}</div>`;
const LIST_SKELETON = `<div class="card">${skel(22, '40%')}<div style="height:12px"></div>${[1, 2, 3, 4, 5].map(() => skel(38) + '<div style="height:8px"></div>').join('')}</div>`;
const num = n => Number(n ?? 0).toLocaleString(undefined, {maximumFractionDigits: 2});
const money = n => CUR + ' ' + num(n);
const pct = n => n == null ? '—' : (n * 100).toFixed(1) + '%';
const fmt = iso => iso ? new Date(iso).toLocaleString() : '—';
const sign = n => n > 0 ? 'pos' : n < 0 ? 'neg' : '';
const kv = (label, val, cls = '') => `<div class="kv">${esc(label)}<b class="${cls}">${val}</b></div>`;

// ---- tiny bar chart (inline SVG, no libraries). Bars above the line are green, below are red.
function bars(series, key, w = 760, h = 150) {
  if (!series.length) return '';
  const vals = series.map(r => r[key]), max = Math.max(1, ...vals.map(Math.abs)), mid = h / 2 + 4, bw = w / series.length;
  return `<svg viewBox="0 0 ${w} ${h + 18}" width="100%" role="img" aria-label="${esc(key)} by day"><line x1="0" x2="${w}" y1="${mid}" y2="${mid}" stroke="#2a2a30"/>` +
    series.map((r, i) => { const v = r[key], bh = Math.abs(v) / max * (h / 2 - 4), y = v >= 0 ? mid - bh : mid;
      return `<rect x="${i * bw + 1}" y="${y}" width="${Math.max(1, bw - 2)}" height="${Math.max(bh, v ? 1 : 0)}" fill="${v >= 0 ? '#2ee59d' : '#ff6b6d'}"><title>${esc(r.day)}: ${num(v)}</title></rect>`; }).join('') +
    `<text x="0" y="${h + 14}">${esc(series[0].day)}</text><text x="${w}" y="${h + 14}" text-anchor="end">${esc(series.at(-1).day)}</text></svg>`;
}


// ---- dashboard charts
function spark(vals, color = '#2ee59d', w = 120, h = 38) {
  if (vals.length < 2) return '';
  const min = Math.min(...vals, 0), max = Math.max(...vals, 1), r = max - min || 1, dx = w / (vals.length - 1);
  const pts = vals.map((v, i) => [i * dx, h - 3 - (v - min) / r * (h - 8)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${line} L${w} ${h} L0 ${h} Z" fill="${color}" opacity=".12"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
function pairBars(series, a, b, ca, cb, w = 760, h = 150) {
  const max = Math.max(1, ...series.flatMap(r => [r[a], r[b]])), bw = w / series.length;
  return `<svg viewBox="0 0 ${w} ${h + 18}" width="100%"><line x1="0" x2="${w}" y1="${h}" y2="${h}" stroke="#2a2a30"/>` + series.map((r, i) => {
    const ha = r[a] / max * (h - 6), hb = r[b] / max * (h - 6), x = i * bw + 1, q = Math.max(1, bw / 2 - 1.5);
    return `<rect x="${x}" y="${h - ha}" width="${q}" height="${ha}" fill="${ca}"><title>${esc(r.day)} · ${esc(a)} ${num(r[a])}</title></rect><rect x="${x + q + 1}" y="${h - hb}" width="${q}" height="${hb}" fill="${cb}"><title>${esc(r.day)} · ${esc(b)} ${num(r[b])}</title></rect>`;
  }).join('') + `<text x="0" y="${h + 14}">${esc(series[0].day)}</text><text x="${w}" y="${h + 14}" text-anchor="end">${esc(series.at(-1).day)}</text></svg>`;
}
const delta = (cur, prev, invert) => { if (!prev) return ''; const p = (cur - prev) / Math.abs(prev), good = invert ? p < 0 : p > 0;
  return `<span class="${p === 0 ? '' : good ? 'pos' : 'neg'}">${p > 0 ? '▲' : p < 0 ? '▼' : '•'} ${Math.abs(p * 100).toFixed(0)}%</span> vs yesterday`; };
let MODE = ss('dashMode') === 'demo' ? 'demo' : 'live', PERIOD = ['today', 'yesterday', 'week', 'month', 'all'].includes(ss('dashPeriod')) ? ss('dashPeriod') : 'today';
const keep = (k, v) => { try { sessionStorage.setItem(k, v); } catch {} };
const PERIODS = {today: 'Today', yesterday: 'Yesterday', week: '7 days', month: '30 days', all: 'All time'};
let AUTO = ss('dashAuto') === '1', autoTimer, agoTimer;
const ago = iso => { const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000)); return 'Updated ' + (s < 5 ? 'just now' : s < 60 ? s + 's ago' : s < 3600 ? Math.round(s / 60) + ' min ago' : fmt(iso)); };
const dur = s => s > 86400 ? Math.floor(s / 86400) + 'd ' + Math.floor(s % 86400 / 3600) + 'h' : s > 3600 ? Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm' : Math.floor(s / 60) + 'm';

function renderDashboard(d) {
  CUR = d.currency; const live = MODE === 'live', W = d.windows, cur = W[PERIOD], t = cur[MODE], prev = W.yesterday[MODE];
  const A = v => live ? money(v) : num(v) + ' cr', S = d.series;
  const sg = k => S.map(r => r[k]);
  const games = Object.entries(t.games).sort((a, b) => b[1].wagered - a[1].wagered), totalW = Math.max(1, t.wagered);
  const best = games.filter(g => g[1].rounds).sort((a, b) => b[1].ggr - a[1].ggr)[0];
  const row = (label, k) => { const x = W[k], l = x[MODE]; return `<tr class="${k === PERIOD ? 'hl' : ''}"><td><b>${label}</b></td><td class="n">${num(l.rounds)}</td><td class="n">${A(l.wagered)}</td><td class="n">${A(l.paid)}</td><td class="n ${sign(l.ggr)}">${A(l.ggr)}</td><td class="n">${pct(l.winRate)}</td><td class="n">${pct(l.rtp)}</td>` +
    (live ? `<td class="n">${money(x.money.deposits)}</td><td class="n">${money(x.money.payouts)}</td><td class="n ${sign(x.money.netCash)}">${money(x.money.netCash)}</td>` : '') + '</tr>'; };
  const h = d.health, p = d.players;
  return `
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
    <div class="seg" id="modeSeg"><button data-m="live" class="${live ? 'on' : ''}">Live money</button><button data-m="demo" class="${live ? '' : 'on'}">Demo credits</button></div>
    <div class="seg" id="perSeg">${Object.entries(PERIODS).map(([k, v]) => `<button data-p="${k}" class="${k === PERIOD ? 'on' : ''}">${v}</button>`).join('')}</div>
    <span class="spacer"></span><span class="s" id="ago">${ago(d.fetchedAt || d.asOf)}</span>${d.since ? '<span class="s">· history since ' + esc(d.since) + '</span>' : ''}<label class="s" style="margin:0;display:flex;gap:5px;align-items:center;cursor:pointer"><input type="checkbox" id="auto" ${AUTO ? 'checked' : ''}> Auto-refresh</label><button class="small" id="refresh" title="Press R">↻ Refresh</button>
  </div>
  ${live ? '' : '<div class="warn">Demo credits are practice play and are never counted as profit or money.</div>'}
  <div class="hero">
    <div class="kpi"><div class="l">${live ? 'House profit' : 'Credits won by the house'}</div><div class="v ${sign(t.ggr)}">${A(t.ggr)}</div><div class="d">${PERIOD === 'today' ? delta(t.ggr, prev.ggr) : PERIODS[PERIOD]}</div>${spark(sg('ggr'), t.ggr < 0 ? '#ff6b6d' : '#2ee59d')}</div>
    <div class="kpi"><div class="l">Total bet</div><div class="v">${A(t.wagered)}</div><div class="d">${PERIOD === 'today' ? delta(t.wagered, prev.wagered) : num(t.rounds) + ' rounds'}</div>${spark(sg('wagered'), '#5aa9ff')}</div>
    <div class="kpi"><div class="l">Paid back to players</div><div class="v">${A(t.paid)}</div><div class="d">Return to player ${pct(t.rtp)}</div>${spark(sg('paid'), '#ffc83d')}</div>
    <div class="kpi"><div class="l">Rounds played</div><div class="v">${num(t.rounds)}</div><div class="d">Avg bet ${A(t.avgBet)}</div>${spark(sg(live ? 'rounds' : 'demoRounds'), '#9a9aa5')}</div>
  </div>
  <div class="grid" style="margin-bottom:14px">
    ${kv('Player win rate', pct(t.winRate))}${kv('House hold', pct(t.hold), sign(t.hold))}${kv('Best game', best ? esc(best[0]) + ' · ' + A(best[1].ggr) : '—')}
    ${live ? kv('Deposits', money(cur.money.deposits)) + kv('Payouts sent', money(cur.money.payouts)) + kv('Net cash', money(cur.money.netCash), sign(cur.money.netCash)) + kv('Round pack sales', money(cur.money.roundpacks) + ' · ' + num(cur.money.roundpack_count) + ' sold') + kv('Payouts waiting', d.payouts.pending + (d.payouts.pending ? ' · ' + money(d.payouts.pendingAmount) : ''), d.payouts.pending ? 'neg' : '') : ''}
  </div>
  <div class="two">
    <div class="card"><h2>Bets vs paid out, last 30 days</h2><div class="legend"><span><i style="background:#5aa9ff"></i>Bet</span><span><i style="background:#ffc83d"></i>Paid back</span></div>${pairBars(S, 'wagered', 'paid', '#5aa9ff', '#ffc83d')}</div>
    <div class="card"><h2>${live ? 'Profit per day' : 'Rounds per day'}</h2>${bars(S, live ? 'ggr' : 'demoRounds')}</div>
    ${live ? `<div class="card"><h2>Cash in vs cash out</h2><div class="legend"><span><i style="background:#2ee59d"></i>Deposits</span><span><i style="background:#ff6b6d"></i>Payouts</span></div>${pairBars(S, 'deposits', 'payouts', '#2ee59d', '#ff6b6d')}</div>` : ''}
    <div class="card" style="grid-column:1/-1"><h2>Games · ${PERIODS[PERIOD]}</h2><table><tr><th>Game</th><th class="n">Rounds</th><th class="n">Bet</th><th class="n">Profit</th><th class="n">RTP</th><th>Share of bets</th></tr>${games.map(([g, r]) => `<tr><td>${esc(g)}</td><td class="n">${num(r.rounds)}</td><td class="n">${A(r.wagered)}</td><td class="n ${sign(r.ggr)}">${A(r.ggr)}</td><td class="n">${pct(r.rtp)}</td><td><div class="bar"><i style="width:${(r.wagered / totalW * 100).toFixed(0)}%"></i></div></td></tr>`).join('')}</table></div>
  </div>
  <div class="card"><h2>Periods side by side</h2><div style="overflow-x:auto"><table><tr><th></th><th class="n">Rounds</th><th class="n">Bet</th><th class="n">Paid</th><th class="n">${live ? 'Profit' : 'House'}</th><th class="n">Win rate</th><th class="n">RTP</th>${live ? '<th class="n">Deposits</th><th class="n">Payouts</th><th class="n">Net cash</th>' : ''}</tr>
    ${Object.entries(PERIODS).map(([k, v]) => row(v, k)).join('')}</table></div></div>
  <div class="two">
    <div class="card"><h2>Players</h2><div class="grid">${kv('Total', num(p.total))}${kv('New today', num(p.newToday))}${kv('New this week', num(p.newWeek))}${kv('Active today', num(p.active24h))}${kv('Active this week', num(p.active7d))}${kv('Daily / monthly', p.stickiness == null ? '—' : pct(p.stickiness))}</div></div>
    <div class="card"><h2>Server health</h2><div class="grid">${kv('Uptime', dur(h.uptimeSeconds))}${kv('Response (typical)', h.p50 + ' ms')}${kv('Response (slowest 5%)', h.p95 + ' ms', h.p95 > 2000 ? 'neg' : '')}${kv('Error rate (5 min)', pct(h.errorRate), h.errorRate > .02 ? 'neg' : '')}${kv('Database limit errors', num(h.quotaErrors), h.quotaErrors ? 'neg' : '')}${kv('Open crashes', num(h.openCrashes), h.openCrashes ? 'neg' : '')}</div></div>
  </div>
  <p class="s">${esc(d.note)}</p>`;
}

const TABS = {
  overview: {label: 'Dashboard', skeleton: SKELETON, run: async () => { window.DASH = await api('/admin/api/insights/dashboard'); window.DASH.fetchedAt = new Date().toISOString(); return renderDashboard(window.DASH); },
    after: () => {
      const redo = () => { $('#view').innerHTML = renderDashboard(window.DASH); TABS.overview.after(); };
      $('#modeSeg').onclick = e => { const m = e.target.dataset.m; if (m) { MODE = m; keep('dashMode', m); redo(); } };
      $('#perSeg').onclick = e => { const p = e.target.dataset.p; if (p) { PERIOD = p; keep('dashPeriod', p); redo(); } };
      $('#refresh').onclick = e => act(e.currentTarget, 'Refreshing…', () => reload(), 'Dashboard updated');
      $('#auto').onchange = e => { AUTO = e.target.checked; keep('dashAuto', AUTO ? '1' : '0'); schedule(); };
      clearInterval(agoTimer); agoTimer = setInterval(() => { const el = $('#ago'); if (el && window.DASH) el.textContent = ago(window.DASH.fetchedAt || window.DASH.asOf); }, 10000);
    }},
  profit: {label: 'Profit', skeleton: SKELETON, run: async () => {
    const days = +($('#range')?.value || 30), d = await api('/admin/api/insights/profit?days=' + days); CUR = d.currency; const L = d.live, M = d.money;
    const games = Object.entries(L.games).map(([g, r]) => `<tr><td>${esc(g)}</td><td>${num(r.rounds)}</td><td>${money(r.wagered)}</td><td>${money(r.paid)}</td><td class="${sign(r.ggr)}">${money(r.ggr)}</td><td>${pct(r.rtp)}</td></tr>`).join('');
    return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><select id="range">${[7, 14, 30, 60, 90].map(n => `<option ${n === days ? 'selected' : ''}>${n}</option>`).join('')}</select><span class="s">days</span></div>
      <div class="grid">${kv('House profit (live)', money(L.ggr), sign(L.ggr))}${kv('Wagered (live)', money(L.wagered))}${kv('Paid back to players', money(L.paid))}${kv('Return to player', pct(L.rtp))}
      ${kv('Deposits received', money(M.deposits))}${kv('Payouts sent', money(M.payouts))}${kv('Net cash', money(M.netCash), sign(M.netCash))}${kv('Refunded (rejected payouts)', money(M.refunds))}</div>
      <div class="card" style="margin-top:14px"><h2>Live profit per day</h2>${bars(d.series, 'liveGgr')}</div>
      <div class="card"><h2>Live profit by game</h2><table><tr><th>Game</th><th>Rounds</th><th>Wagered</th><th>Paid</th><th>Profit</th><th>RTP</th></tr>${games}</table></div>
      <div class="card"><h2>Demo credits (not real money)</h2><div class="grid">${kv('Rounds', num(d.demo.rounds))}${kv('Credits wagered', num(d.demo.wagered))}${kv('Win rate', pct(d.demo.winRate))}${kv('Return to player', pct(d.demo.rtp))}</div></div>
      <p class="s">${esc(d.note)}</p>`;
  },
    after: () => { $('#range').onchange = () => reload(); }},
  payouts: {skeleton: LIST_SKELETON, label: 'Payouts', run: async () => {
    const d = await api('/admin/api/payments?kind=payout&status=pending_review'); CUR = d.currency;
    return `<div class="card"><h2>Waiting for your approval (${d.payments.length})</h2>` + (d.mock ? '<div class="warn">Mock payments: no real money moves.</div>' : '') +
      (d.payments.length ? `<table><tr><th>Player</th><th>Amount</th><th>Via</th><th>Requested</th></tr>${d.payments.map(p => `<tr><td>${esc(p.player)}</td><td>${money(p.amount)}</td><td>${esc(p.provider)}</td><td>${fmt(p.createdAt)}</td></tr>`).join('')}</table>` : '<div class="s">Nothing waiting.</div>') +
      `<p><a href="/admin/payments">Open the payout desk</a>: every payout is approved there one at a time by typing its own reference.</p></div>`;
  }},
  accounts: {skeleton: LIST_SKELETON, label: 'Accounts', run: async () => `<div class="card"><input id="q" placeholder="Search name, email or id" style="width:100%"><div id="hits" style="margin-top:10px"></div></div><div id="acct"></div>`,
    after: () => { let h; $('#q').oninput = () => { clearTimeout(h); h = setTimeout(async () => {
      $('#hits').innerHTML = '<div class="s"><span class="spin"></span>Searching…</div>';
      let d; try { d = await api('/admin/api/users?q=' + encodeURIComponent($('#q').value)); } catch (e) { $('#hits').innerHTML = `<div class="s neg">${esc(e.message)}</div>`; return; }
      $('#hits').innerHTML = d.users.slice(0, 12).map(u => `<div class="row" data-u="${esc(u.uid)}"><b>${esc(u.displayName || u.email || u.uid)}</b> <span class="s">${esc(u.email || '')} · ${esc(u.state)}</span></div>`).join('') || '<div class="s">No one found.</div>';
      document.querySelectorAll('[data-u]').forEach(r => r.onclick = () => account(r.dataset.u)); }, 300); }; $('#q').oninput(); }},
  activity: {skeleton: LIST_SKELETON, label: 'Activity', run: async () => {
    const d = await api('/admin/api/insights/activity'), list = rows => rows.map(r => `<tr><td>${esc(r.name || r.email || r.uid)}</td><td class="s">${fmt(r.lastSeenAt)}</td></tr>`).join('') || '<tr><td class="s">None</td></tr>';
    return `<div class="grid">${kv('Players', num(d.total))}${kv('Active today', num(d.active24h))}${kv('Active this week', num(d.active7d))}${kv('Active ' + d.activeDays + ' days', num(d['active' + d.activeDays + 'd']))}${kv('Inactive', num(d.inactive))}${kv('Daily / monthly', d.stickiness == null ? '—' : pct(d.stickiness))}</div>
      <div class="grid" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h2>Active (newest players)</h2><table>${list(d.active)}</table></div><div class="card"><h2>Gone quiet</h2><table>${list(d.quiet)}</table><p class="s">Email them from the Email tab.</p></div></div>
      <p class="s">${esc(d.note)}</p>`;
  }},
  crashes: {skeleton: LIST_SKELETON, label: 'Crashes', run: async () => {
    const d = await api('/admin/api/insights/crashes');
    return `<div class="card"><h2>Crash groups</h2><p class="s">The same bug is counted once with a total. Reported by the app and by the server.</p>` + (d.crashes.length ? d.crashes.map(c => `<div class="row" style="cursor:default"><div><span class="pill ${esc(c.status)}">${esc(c.status)}</span> <b>${esc(c.kind)}</b> · ${esc(c.source)} · ×${num(c.count)}</div><div class="s">${esc(c.message)}</div><div class="s">${esc(c.platform || '')} ${esc(c.appVersion || '')} ${esc(c.path || '')} · first ${fmt(c.firstSeenAt)} · last ${fmt(c.lastSeenAt)}</div><details><summary class="s">Stack</summary><pre>${esc(c.stack)}</pre></details>
      <button class="small" data-c="${esc(c.id)}" data-s="resolved">Resolve</button> <button class="small" data-c="${esc(c.id)}" data-s="ignored">Ignore</button> <button class="small" data-c="${esc(c.id)}" data-s="open">Reopen</button></div>`).join('') : '<div class="s">No crashes reported. 🎉</div>') + '</div>';
  },
    after: () => document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => act(b, {resolved: 'Resolving…', ignored: 'Ignoring…', open: 'Reopening…'}[b.dataset.s], async () => { await api(`/admin/api/insights/crashes/${b.dataset.c}/status`, {status: b.dataset.s}); await reload(); }, {resolved: 'Marked resolved', ignored: 'Ignored', open: 'Reopened'}[b.dataset.s]))},
  email: {skeleton: LIST_SKELETON, label: 'Email', run: async () => {
    const c = await api('/admin/api/email/campaigns');
    return `<div class="card"><h2>New message</h2>${c.mode === 'mock' ? '<div class="warn">Mock mode: set SMTP_HOST on the server to really send. Nothing leaves the server now.</div>' : ''}
      <label>To</label><select id="aud"><option value="all">Everyone</option><option value="active">Active players</option><option value="inactive">Inactive players</option><option value="user">One player…</option></select>
      <input id="one" placeholder="player id or email" style="display:none;width:100%;margin-top:6px"><span class="s" id="cnt"></span>
      <label>Subject</label><input id="sub" maxlength="150" style="width:100%"><label>Message (plain text, {name} becomes their first name)</label><textarea id="msg" rows="6" style="width:100%" maxlength="5000"></textarea>
      <label>Type <b>SEND</b> to confirm</label><div style="display:flex;gap:8px"><input id="conf" autocomplete="off" style="width:120px"><button class="primary" id="go" disabled>Send</button></div></div>
      <div class="card"><h2>Recent campaigns</h2><table><tr><th>When</th><th>To</th><th>Subject</th><th>Result</th></tr>${c.campaigns.map(x => `<tr><td>${fmt(x.createdAt)}</td><td>${esc(x.audience)}</td><td>${esc(x.subject)}<div class="s">${esc(x.preview)}</div></td><td>${esc(x.status)}${x.mode === 'mock' ? ' (mock)' : ''}<div class="s">${x.sent}/${x.total} sent${x.failed ? ', ' + x.failed + ' failed' : ''}${x.skipped ? ', ' + x.skipped + ' skipped' : ''}</div></td></tr>`).join('') || '<tr><td class="s" colspan="4">None yet.</td></tr>'}</table></div>`;
  },
    after: () => {
    let key = crypto.randomUUID(); const aud = () => $('#aud').value === 'user' ? 'user:' + $('#one').value.trim() : $('#aud').value;
    const check = () => $('#go').disabled = $('#conf').value !== 'SEND';
    $('#aud').onchange = async () => { $('#one').style.display = $('#aud').value === 'user' ? '' : 'none'; if ($('#aud').value !== 'user') { try { $('#cnt').textContent = ' ≈ ' + num((await api('/admin/api/email/count', {audience: aud()})).count) + ' players'; } catch {} } else $('#cnt').textContent = ''; };
    $('#aud').onchange(); $('#conf').oninput = check;
    $('#go').onclick = e => act(e.currentTarget, 'Sending…', async () => { await api('/admin/api/email/send', {audience: aud(), subject: $('#sub').value, body: $('#msg').value, key, confirm: $('#conf').value}); key = crypto.randomUUID(); await reload(); }, 'Message queued');
  }},
};

async function account(uid) {
  $('#acct').innerHTML = LIST_SKELETON; $('#acct').scrollIntoView({behavior: 'smooth', block: 'start'});
  let a; try { a = await api('/admin/api/insights/accounts/' + encodeURIComponent(uid)); } catch (e) { $('#acct').innerHTML = `<div class="errbox"><b>Could not load this player</b><p>${esc(e.message)}</p></div>`; return; }
  CUR = a.money.currency;
  $('#acct').innerHTML = `<div class="card"><h2>${esc(a.name || a.email || a.uid)} <span class="pill">${esc(a.state)}</span></h2><div class="s">${esc(a.email || 'no email')} · ${esc(a.uid)}${a.anonymous ? ' · guest' : ''}</div>
    <div class="grid" style="margin-top:10px">${kv('Joined', fmt(a.createdAt))}${kv('Last sign-in', fmt(a.lastLoginAt))}${kv('Last seen', fmt(a.lastSeenAt))}${kv('Demo balance', num(a.demo.balance))}${kv('Live balance', money(a.live.balance))}${kv('Deposited', money(a.money.deposited))}${kv('Paid out', money(a.money.paidOut))}${kv('Payout pending', money(a.money.payoutPending))}${kv('House result on this player', money(a.money.netToHouse), sign(a.money.netToHouse))}${kv('Live rounds', num(a.live.totalRounds))}${kv('Demo rounds', num(a.demo.totalRounds))}${kv('Level (live / demo)', (a.live.level ?? '—') + ' / ' + (a.demo.level ?? '—'))}</div>
    <h3>Timeline</h3><table>${a.timeline.map(e => `<tr><td class="s">${fmt(e.at)}</td><td>${esc(e.kind)}</td><td>${esc(e.text)}</td></tr>`).join('') || '<tr><td class="s">Nothing yet.</td></tr>'}</table>
    <p class="s">To restrict or ban, use <a href="/admin">Moderation</a> and search this player.</p></div>`;
}

const TAB_IDS = Object.keys(TABS);
let cur = TAB_IDS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview', seq = 0;
function tabs() {
  $('#tabs').innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-t="${k}" class="${k === cur ? 'on' : ''}">${v.label}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => b.dataset.t !== cur || !$('#view').dataset.ok ? show(b.dataset.t) : reload());
}
/** Loads a tab. A new tab shows placeholders; reloading the same tab keeps the old content on screen (dimmed) until the new data arrives. */
async function load(t, soft) {
  const my = ++seq, view = $('#view'); TAB_CTRL.abort(); TAB_CTRL = new AbortController();
  clearInterval(agoTimer);
  if (soft && view.dataset.ok) view.classList.add('stale'); else { view.classList.remove('stale'); view.innerHTML = TABS[t].skeleton || LIST_SKELETON; delete view.dataset.ok; }
  setStatus('Updating…', true);
  try {
    const html = await TABS[t].run();
    if (my !== seq) return;
    const y = window.scrollY; view.innerHTML = html; view.dataset.ok = '1'; view.classList.remove('stale');
    if (!soft) view.firstElementChild?.classList.add('fade'); else window.scrollTo(0, y);
    if (TABS[t].after) TABS[t].after();
    setStatus('Live'); schedule();
  } catch (e) {
    if (my !== seq) return;
    view.classList.remove('stale');
    if (soft && view.dataset.ok) { toast(e.message, true); setStatus('Offline', false, true); throw e; }
    view.innerHTML = `<div class="errbox"><b>Could not load ${esc(TABS[t].label)}</b><p>${esc(e.message)}</p><button class="primary" id="retry">Try again</button></div>`;
    $('#retry').onclick = () => load(t); setStatus('Offline', false, true);
  }
}
function setStatus(text, busy, off) { const el = $('#status'); el.className = 'live' + (off ? ' off' : ''); el.lastElementChild.textContent = text; el.firstElementChild.style.opacity = busy ? .4 : 1; }
function show(t) { cur = t; try { history.replaceState(null, '', '#' + t); } catch {} tabs(); return load(t); }
const reload = () => load(cur, true);
function schedule() { clearTimeout(autoTimer); if (AUTO && cur === 'overview') autoTimer = setTimeout(() => { if (!document.hidden) reload().catch(() => {}); else schedule(); }, 60000); }
document.addEventListener('keydown', e => { if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) { e.preventDefault(); reload().catch(() => {}); } });
window.addEventListener('online', () => reload().catch(() => {}));
show(cur);
</script>
