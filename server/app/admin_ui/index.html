<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>REV Games · Admin</title>
<style>
  :root{--bg:#0b0b0d;--panel:#141417;--panel2:#1b1b1f;--line:#2a2a30;--text:#f2f2f4;--dim:#9a9aa5;--green:#2ee59d;--red:#ff6b6d;--gold:#ffc83d;--purple:#b26bff;--blue:#5aa9ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  h1{font-size:16px;margin:0;letter-spacing:.3px}
  h1 b{color:var(--gold)}
  input,select,textarea,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  input[type=checkbox]{width:auto;padding:0}
  textarea{width:100%;resize:vertical;min-height:54px}
  select,input:not([type=checkbox]){max-width:100%}
  input:focus,select:focus,textarea:focus{outline:1px solid var(--purple)}
  button{cursor:pointer}
  button:hover{border-color:#44444d}
  button.primary{background:var(--green);color:#04170f;border-color:var(--green);font-weight:700}
  button.danger{background:var(--red);color:#2a0507;border-color:var(--red);font-weight:700}
  button.ghost{background:transparent}
  button.small{padding:3px 9px;font-size:12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  .spacer{flex:1}
  #status{font-size:12px;color:var(--dim)}
  main{display:grid;grid-template-columns:360px 1fr;gap:16px;padding:16px 18px;max-width:1400px;margin:0 auto}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .card h2{font-size:12px;margin:0 0 10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1;padding:6px;font-size:12px}
  .tabs button.on{background:var(--purple);color:#14041f;border-color:var(--purple);font-weight:700}
  .list{display:flex;flex-direction:column;gap:6px;max-height:64vh;overflow:auto;margin-top:10px}
  .row{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;display:flex;gap:10px}
  .row:hover,.row.sel{border-color:var(--purple)}
  .row .body{flex:1;min-width:0}
  .row .n{font-weight:600}
  .row .s{color:var(--dim);font-size:12px;word-break:break-all}
  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid var(--line);margin-right:4px;white-space:nowrap}
  .good{color:var(--green);border-color:#1b6b4b}
  .banned{color:var(--red);border-color:#7a2a2b;background:#2a1011}
  .suspended{color:#ff9a5a;border-color:#7a4a2b;background:#2a1a10}
  .under_review{color:var(--blue);border-color:#2b4a7a;background:#101a2a}
  .restricted{color:var(--gold);border-color:#7a652b;background:#2a2410}
  .probation{color:var(--purple);border-color:#4f2b7a;background:#1a102a}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .kv{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .kv small{display:block;color:var(--dim);font-size:11px;letter-spacing:.5px;text-transform:uppercase}
  .kv b{font-size:15px}
  .flag-on{color:var(--red)}
  .stack{display:flex;flex-direction:column;gap:12px}
  .act{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2)}
  .act .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .act .meta{color:var(--dim);font-size:12px;margin-top:4px}
  .act.active{border-color:#7a2a2b}
  .quote{border-left:3px solid var(--line);padding-left:10px;margin:6px 0;color:var(--text);white-space:pre-wrap;word-break:break-word}
  label{display:block;color:var(--dim);font-size:12px;margin:8px 0 3px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--line);padding:10px 16px;border-radius:10px;display:none;z-index:30}
  .toast.err{border-color:var(--red);color:var(--red)}
  .empty{color:var(--dim);padding:12px;text-align:center}
  code{background:var(--panel2);padding:1px 6px;border-radius:6px;font-size:12px}
  .hint{color:var(--dim);font-size:12px;margin-top:4px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;margin:4px 6px 0 0}
  .chip:hover{border-color:var(--purple)}
  #selbar{display:none;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border:1px solid var(--purple);border-radius:10px;font-size:12px;flex-wrap:wrap}
  /* gate */
  #gate{display:none;min-height:70vh;align-items:center;justify-content:center;padding:18px}
  #gate .card{width:100%;max-width:400px}
  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
  .modal.wide{max-width:900px}
  .modal h3{margin:0 0 6px}
  .modal img,.modal video{max-width:100%;max-height:70vh;border-radius:8px;display:block;margin:0 auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .okc{color:var(--green)} .bad{color:var(--red)}
</style>
</head>
<body>
<header>
  <h1>REV <b>Games</b> · Admin</h1>
  <span id="status">Signed in</span>
  <span class="spacer"></span>
  <label style="margin:0;display:none;gap:6px;align-items:center" id="liveBox">Live <input id="live" type="checkbox" checked></label>
  <span id="who" style="color:var(--dim);font-size:12px"></span>
  <button class="ghost small" id="lock" style="display:none">Lock</button>
  <button class="ghost small" id="signout">Sign out</button>
</header>

<section id="gate">
  <div class="card">
    <h2>Connect to the dashboard</h2>
    <p style="margin-top:0;color:var(--dim)">You're signed in as <b id="gateWho"></b>. Enter the admin key to open the moderation tools.</p>
    <label>Admin key</label>
    <input id="key" type="password" autocomplete="off" style="width:100%" placeholder="ADMIN_KEY from the server">
    <div id="gateErr" class="hint" style="color:var(--red);min-height:18px"></div>
    <button id="connect" class="primary" style="width:100%;margin-top:8px">Connect</button>
  </div>
</section>

<main id="app" style="display:none">
  <section class="card">
    <div class="tabs">
      <button data-tab="players" class="on">Players</button>
      <button data-tab="recent">Recent</button>
      <button data-tab="feed">Feed</button>
      <button data-tab="team">Team</button>
    </div>
    <div id="searchBar"><input id="q" placeholder="Search name, email or uid" style="width:100%"></div>
    <div id="recentBar" style="display:none">
      <select id="recentDays" style="width:100%">
        <option value="1">Restricted in the last 24 hours</option>
        <option value="3" selected>Restricted in the past 3 days</option>
        <option value="7">Restricted in the past 7 days</option>
        <option value="30">Restricted in the past 30 days</option>
      </select>
    </div>
    <div id="selbar"><b id="selCount">0</b> selected
      <button class="small ghost" id="selAll">Select all shown</button>
      <button class="small ghost" id="selNone">Clear</button>
      <span class="spacer"></span>
      <button class="small primary" id="selBulk">Bulk action…</button>
    </div>
    <div style="margin-top:10px"><button class="small ghost" id="openBulk" style="width:100%">Bulk actions by pasting ids or emails…</button></div>
    <div id="list" class="list"></div>
  </section>

  <section id="detail" class="stack"><div class="card empty">Pick a player on the left.</div></section>
</main>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div id="toast" class="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get: k => { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} }, del: k => { try { sessionStorage.removeItem(k); } catch {} } };
const TOKEN = store.get('staffToken');
if (!TOKEN) location.replace('/staff');
let KEY = store.get('adminKey');
let tab = 'players', selected = null, mode = 'player', cfg = {riskWindowDays: 3, probationHours: 72, reasons: {apply: {}, lift: []}};
const sel = new Set();

const TYPE_LABEL = {ban: 'Ban', suspension: 'Suspension', payout_restriction: 'Payout restriction', investigation: 'Investigation'};
const STATE_LABEL = {good: 'Good standing', banned: 'Banned', suspended: 'Suspended', restricted: 'Restricted', under_review: 'Under investigation', probation: 'Probation'};
const typeClass = t => t === 'ban' ? 'banned' : t === 'suspension' ? 'suspended' : t === 'investigation' ? 'under_review' : 'restricted';

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 3600);
}
function signOut() { store.del('staffToken'); store.del('adminKey'); location.replace('/staff'); }
function showGate(msg) { $('#gate').style.display = 'flex'; $('#app').style.display = 'none'; $('#lock').style.display = 'none'; $('#liveBox').style.display = 'none'; $('#gateErr').textContent = msg || ''; $('#key').focus(); }

async function request(path, opts = {}) {
  const res = await fetch(path, {...opts, headers: {'Authorization': 'Bearer ' + TOKEN, 'X-Admin-Key': KEY, ...(opts.body instanceof FormData ? {} : {'Content-Type': 'application/json'}), ...(opts.headers || {})}});
  return res;
}
async function api(path, opts = {}) {
  const res = await request(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (data.error === 'staff_unauthenticated') { signOut(); }
    if (data.error === 'wrong_role') { location.replace('/support'); }
    if (data.error === 'bad_admin_key') { KEY = ''; store.del('adminKey'); showGate('That key was not accepted.'); }
    const err = new Error(data.message || ('HTTP ' + res.status)); err.code = data.error; err.status = res.status; throw err;
  }
  return data;
}
const post = (path, body) => api(path, {method: 'POST', body: JSON.stringify(body || {})});
const fmt = iso => iso ? new Date(iso).toLocaleString() : '—';
const ago = iso => {
  if (!iso) return '—';
  const s = (Date.now() - new Date(iso)) / 1000, a = Math.abs(s);
  const t = a < 90 ? Math.round(a) + 's' : a < 5400 ? Math.round(a / 60) + 'm' : a < 172800 ? Math.round(a / 3600) + 'h' : Math.round(a / 86400) + 'd';
  return s >= 0 ? t + ' ago' : 'in ' + t;
};
const stateBadge = s => `<span class="pill ${esc(s)}">${esc(STATE_LABEL[s] || s)}</span>`;
const fileSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';

// ---------------------------------------------------------------- modal
function modal(html, wide) {
  $('#modal').className = 'modal' + (wide ? ' wide' : ''); $('#modal').innerHTML = html; $('#scrim').style.display = 'flex';
  return $('#modal');
}
function closeModal() { $('#scrim').style.display = 'none'; $('#modal').innerHTML = ''; }
$('#scrim').onclick = e => { if (e.target === $('#scrim')) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ---------------------------------------------------------------- reason picker (free text only for "Other")
function reasonFields(id, items, opts = {}) {
  const first = items.find(i => !i.custom) || items[0];
  return `<label>${esc(opts.label || 'Reason')}</label>
    <select id="${id}" data-keep="${id}" style="width:100%">${items.map(i => `<option value="${esc(i.code)}">${esc(i.label)}</option>`).join('')}</select>
    <div id="${id}-custom" style="display:none">
      <label>Describe it (${cfg.reasons.customMin || 10}–${cfg.reasons.customMax || 300} characters)</label>
      <textarea id="${id}-text" data-keep="${id}-text" maxlength="${cfg.reasons.customMax || 300}"></textarea>
      ${opts.publicNote ? `<label>Message to the player (optional)</label><textarea id="${id}-pub" data-keep="${id}-pub" maxlength="1000"></textarea>` : ''}
    </div>`;
}
function wireReason(id) {
  const s = $('#' + id), box = $('#' + id + '-custom');
  const sync = () => { const other = s.value === (cfg.reasons.other || 'other'); box.style.display = other ? '' : 'none'; };
  s.onchange = sync; sync();
}
function readReason(id) {
  const s = $('#' + id), other = s.value === (cfg.reasons.other || 'other');
  const out = {reasonCode: s.value};
  if (other) { out.customReason = $('#' + id + '-text').value.trim(); const p = $('#' + id + '-pub'); if (p) out.publicNote = p.value.trim(); }
  return out;
}

// ---------------------------------------------------------------- connect
async function connect(fromStored) {
  const typed = $('#key').value.trim();
  if (typed) KEY = typed;
  if (!KEY) return showGate();
  try {
    const p = await api('/admin/api/ping');
    cfg = p; store.set('adminKey', KEY);
    $('#key').value = ''; $('#gate').style.display = 'none'; $('#app').style.display = 'grid';
    $('#lock').style.display = ''; $('#liveBox').style.display = 'flex';
    $('#status').textContent = 'Connected · risk window ' + p.riskWindowDays + 'd · probation ' + p.probationHours + 'h';
    loadList();
  } catch (e) {
    if (e.code === 'bad_admin_key') return showGate(fromStored ? '' : 'Wrong key.');
    if (e.code === 'admin_disabled') return showGate('The server has no ADMIN_KEY set, so the dashboard is off.');
    showGate(e.message);
  }
}

// ---------------------------------------------------------------- lists
async function loadList() {
  if (!KEY) return;
  const box = $('#list');
  try {
    if (tab === 'players') {
      const d = await api('/admin/api/users?q=' + encodeURIComponent($('#q').value));
      box.innerHTML = d.users.length ? d.users.map(u => userRow(u)).join('') : '<div class="empty">No players found.</div>';
    } else if (tab === 'recent') {
      const d = await api('/admin/api/recent?days=' + $('#recentDays').value);
      box.innerHTML = d.users.length ? d.users.map(u => userRow(u, u.types.map(t => `<span class="pill">${esc(TYPE_LABEL[t])}</span>`).join(''))).join('') : '<div class="empty">Nobody in this window.</div>';
    } else if (tab === 'feed') {
      const d = await api('/admin/api/feed');
      box.innerHTML = d.events.length ? d.events.map(e => `<div class="row" data-uid="${esc(e.uid)}"><div class="body"><div class="n">${esc(e.event.replaceAll('_', ' '))} · ${esc(TYPE_LABEL[e.type] || e.type)}</div><div class="s">${esc(e.uid)} · ${ago(e.at)} · by ${esc(e.actor)}</div>${e.note ? `<div class="s">${esc(e.note)}</div>` : ''}</div></div>`).join('') : '<div class="empty">No events yet.</div>';
    } else {
      const d = await api('/admin/api/staff');
      box.innerHTML = `<div class="row" id="newRep"><div class="body"><div class="n">+ New customer service rep</div><div class="s">Only you can create or edit reps.</div></div></div>` +
        (d.staff.length ? d.staff.map(s => `<div class="row" data-rep="${esc(s.username)}"><div class="body"><div class="n">${esc(s.name)} <span class="pill ${s.active ? 'good' : 'banned'}">${s.active ? 'active' : 'off'}</span>${s.mustChange ? '<span class="pill restricted">must change password</span>' : ''}</div><div class="s">${esc(s.username)} · last sign-in ${ago(s.lastLoginAt)}</div></div></div>`).join('') : '<div class="empty">No reps yet.</div>');
      $('#newRep').onclick = () => repForm();
      $$('[data-rep]', box).forEach(r => r.onclick = () => repForm(d.staff.find(s => s.username === r.dataset.rep)));
    }
    $$('.row[data-uid]', box).forEach(r => r.onclick = e => { if (e.target.classList.contains('pick')) return; select(r.dataset.uid); });
    $$('.pick', box).forEach(c => c.onchange = () => { c.checked ? sel.add(c.dataset.pick) : sel.delete(c.dataset.pick); syncSel(); });
    syncSel();
  } catch (e) { if (e.status !== 401) box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function userRow(u, extra = '') {
  return `<div class="row ${u.uid === selected && mode === 'player' ? 'sel' : ''}" data-uid="${esc(u.uid)}"><input type="checkbox" class="pick" data-pick="${esc(u.uid)}" ${sel.has(u.uid) ? 'checked' : ''}><div class="body"><div class="n">${esc(u.displayName || 'Player')} ${stateBadge(u.state)}</div><div class="s">${esc(u.email || (u.isAnonymous ? 'guest' : ''))}</div><div class="s">${esc(u.uid)}</div>${extra ? `<div style="margin-top:4px">${extra}</div>` : ''}</div></div>`;
}
function syncSel() {
  const show = sel.size > 0 && tab !== 'team' && tab !== 'feed';
  $('#selbar').style.display = show ? 'flex' : 'none'; $('#selCount').textContent = sel.size;
}
$('#selAll').onclick = () => { $$('.pick').forEach(c => { c.checked = true; sel.add(c.dataset.pick); }); syncSel(); };
$('#selNone').onclick = () => { sel.clear(); $$('.pick').forEach(c => c.checked = false); syncSel(); };
$('#selBulk').onclick = () => bulkPanel([...sel]);
$('#openBulk').onclick = () => bulkPanel([...sel]);
async function select(uid) { selected = uid; mode = 'player'; await loadDetail(); loadList(); }

// ---------------------------------------------------------------- attachments
async function openFile(uid, att) {
  try {
    const res = await request(`/admin/api/files/${encodeURIComponent(uid)}/${encodeURIComponent(att.id)}`);
    if (!res.ok) throw new Error('Could not load the file.');
    const blob = await res.blob(), url = URL.createObjectURL(blob);
    if (att.kind === 'image' && att.mime !== 'image/heic') modal(`<h3>${esc(att.name)}</h3><img src="${url}" alt=""><div style="margin-top:10px;text-align:right"><button class="small" id="mClose">Close</button></div>`, true);
    else if (att.kind === 'video') modal(`<h3>${esc(att.name)}</h3><video src="${url}" controls playsinline></video><div style="margin-top:10px;text-align:right"><button class="small" id="mClose">Close</button></div>`, true);
    else { const a = document.createElement('a'); a.href = url; a.download = att.name; document.body.appendChild(a); a.click(); a.remove(); return; }
    $('#mClose').onclick = () => { URL.revokeObjectURL(url); closeModal(); };
  } catch (e) { toast(e.message, true); }
}
const attChips = (uid, list) => (list || []).map((a, i) => `<span class="chip" data-att="${i}">${a.kind === 'video' ? '🎬' : a.kind === 'pdf' ? '📄' : '🖼'} ${esc(a.name)} · ${fileSize(a.size)}</span>`).join('');
function wireChips(root, uid, list) { $$('[data-att]', root).forEach(c => c.onclick = () => openFile(uid, list[+c.dataset.att])); }

// ---------------------------------------------------------------- player detail
async function loadDetail() {
  if (!selected || mode !== 'player') return;
  try { render(await api('/admin/api/users/' + selected + '?days=' + (window._days || cfg.riskWindowDays || 3))); }
  catch (e) { if (e.status !== 401) $('#detail').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
}

function render(d) {
  const u = d.user, r = d.risk, st = d.standing;
  const keep = {};
  $$('#detail [data-keep]').forEach(el => keep[el.dataset.keep] = el.value);
  const flag = (label, on, val) => `<div class="kv"><small>${label}</small><b class="${on ? 'flag-on' : ''}">${val}</b></div>`;
  const pending = d.appeals.filter(a => a.status === 'pending');
  $('#detail').innerHTML = `
  <div class="card">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div style="font-size:18px;font-weight:700">${esc(u.displayName || 'Player')}</div> ${stateBadge(st.state)}
      ${st.blocksPlay ? '<span class="pill banned">Cannot play</span>' : '<span class="pill good">Can play</span>'}
      ${st.blocksCredits ? '<span class="pill restricted">No free credits</span>' : ''}
      <span class="spacer"></span><button class="ghost small" id="copyUid">Copy uid</button><button class="ghost small" id="bulkOne">Add to bulk</button>
    </div>
    <div style="color:var(--dim);font-size:12px;margin-top:4px">${esc(u.email || (u.isAnonymous ? 'Guest account' : ''))} · ${esc(u.uid)} · last seen ${ago(u.lastLoginAt)}</div>
    ${st.probationUntil ? `<div class="quote" style="border-color:var(--purple)">On probation until ${fmt(st.probationUntil)} (${ago(st.probationUntil)}) · bets capped at ${st.probationMaxBet} · no daily, top-up or reset</div>` : ''}
  </div>

  <div class="card">
    <h2>Risk checks <select id="days" style="float:right;padding:2px 6px;font-size:12px">${[1, 3, 7, 14, 30].map(n => `<option value="${n}" ${n === r.windowDays ? 'selected' : ''}>last ${n} days</option>`).join('')}</select></h2>
    <div class="grid">
      ${flag('Restricted in window', r.restrictedInWindow, r.restrictedInWindow ? 'YES · ' + r.typesInWindow.map(t => TYPE_LABEL[t]).join(', ') : 'No')}
      ${flag('On probation', r.onProbation, r.onProbation ? 'Yes' : 'No')}
      ${flag('Actions (30d)', r.actionsLast30d >= 2, r.actionsLast30d)}
      ${flag('Suspensions (30d)', r.suspensionsLast30d > 0, r.suspensionsLast30d)}
      ${flag('Bans ever', r.bansEver > 0, r.bansEver)}
      ${flag('Repeat offender', r.repeatOffender, r.repeatOffender ? 'Yes (3+ in 30d)' : 'No')}
      ${flag('Open appeals', r.openAppeals > 0, r.openAppeals)}
      <div class="kv"><small>Balance</small><b>${d.balance == null ? '—' : Number(d.balance).toLocaleString()}</b></div>
    </div>
  </div>

  ${pending.length ? `<div class="card"><h2>Appeals waiting</h2><div class="stack">${pending.map(a => `
    <div class="act active"><div class="top"><span class="pill ${typeClass(a.actionType)}">${esc(TYPE_LABEL[a.actionType] || a.actionType)}</span><span style="color:var(--dim)">${ago(a.createdAt)}</span></div>
      <div class="meta">Reason given: ${esc(a.actionReason)}</div>
      <div class="quote">${esc(a.message)}</div>
      ${a.attachments && a.attachments.length ? `<div data-chips="${a.id}">${attChips(u.uid, a.attachments)}</div>` : '<div class="meta">No files attached.</div>'}
      <div style="display:flex;gap:8px;margin-top:10px"><button class="primary" data-decide="approve" data-id="${a.id}">Approve &amp; lift…</button><button class="danger" data-decide="reject" data-id="${a.id}">Reject…</button></div>
    </div>`).join('')}</div></div>` : ''}

  <div class="card">
    <h2>Apply an action</h2>
    <div class="two">
      <div><label>Type</label><select id="newType" data-keep="newType" style="width:100%">
        <option value="payout_restriction">Payout restriction</option><option value="suspension">Suspension</option><option value="investigation">Investigation</option><option value="ban">Ban (permanent)</option></select></div>
      <div id="durBox"><label>Duration</label><select id="newDur" data-keep="newDur" style="width:100%">
        <option value="">Until I lift it</option><option value="1">1 hour</option><option value="24">24 hours</option><option value="72">3 days</option><option value="168">7 days</option><option value="720">30 days</option><option value="0.0167">1 minute (test expiry)</option></select></div>
    </div>
    <div id="applyReason"></div>
    <div id="presetMsg" class="hint"></div>
    <label>Internal note (staff only, never shown to the player)</label><textarea id="newInternal" data-keep="newInternal"></textarea>
    <div style="display:flex;gap:18px;margin:10px 0;flex-wrap:wrap">
      <label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="blocksPlay" checked> Also block play (restriction only)</label>
      <label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="appealOk" checked> Player may appeal</label>
    </div>
    <button class="danger" id="apply">Apply</button>
  </div>

  <div class="card">
    <h2>History</h2>
    <div class="stack">${d.actions.length ? d.actions.map(a => `
      <div class="act ${a.status === 'active' ? 'active' : ''}">
        <div class="top"><span class="pill ${typeClass(a.type)}">${esc(TYPE_LABEL[a.type])}</span>
          <span class="pill">${esc(a.status)}</span>${a.blocksPlay ? '<span class="pill banned">blocks play</span>' : ''}
          <span class="spacer"></span>
          ${a.status === 'active' ? `<button class="small" data-lift="${a.id}">Lift…</button>` : ''}</div>
        <div style="margin-top:6px"><b>${esc(a.reason)}</b></div>
        ${a.publicNote ? `<div class="quote">${esc(a.publicNote)}</div>` : ''}
        <div class="meta">Started ${fmt(a.createdAt)} (${ago(a.createdAt)}) by ${esc(a.createdBy)} · ${a.expiresAt ? 'ends ' + fmt(a.expiresAt) + ' (' + ago(a.expiresAt) + ')' : 'no end date'}${a.endedAt ? ' · ended ' + fmt(a.endedAt) + ' by ' + esc(a.endedBy) + (a.outcome ? ' (' + esc(a.outcome) + ')' : '') : ''}</div>
        ${a.internalNote ? `<div class="meta">Internal: ${esc(a.internalNote)}</div>` : ''}
        ${a.endNote ? `<div class="meta">End note: ${esc(a.endNote)}</div>` : ''}
      </div>`).join('') : '<div class="empty">Clean record.</div>'}</div>
  </div>

  <div class="card">
    <h2>Past appeals</h2>
    <div class="stack">${d.appeals.filter(a => a.status !== 'pending').map(a => `<div class="act"><div class="top"><span class="pill ${a.status === 'approved' ? 'good' : 'banned'}">${esc(a.status)}</span><span class="meta">${ago(a.createdAt)}${a.decidedBy ? ' · decided by ' + esc(a.decidedBy) : ''}</span></div><div class="quote">${esc(a.message)}</div>${a.attachments && a.attachments.length ? `<div data-chips="${a.id}">${attChips(u.uid, a.attachments)}</div>` : ''}${a.response ? `<div class="meta">Reply: ${esc(a.response)}</div>` : ''}</div>`).join('') || '<div class="empty">None.</div>'}</div>
  </div>

  <div class="card">
    <h2>Last rounds</h2>
    ${d.recentRounds.length ? d.recentRounds.map(x => `<div class="meta">${esc(x.game)} · bet ${x.bet} · net ${x.net} · ${ago(x.at)}</div>`).join('') : '<div class="empty">No rounds yet.</div>'}
  </div>`;

  // attachments
  d.appeals.forEach(a => { const el = document.querySelector(`[data-chips="${a.id}"]`); if (el) wireChips(el, u.uid, a.attachments); });

  // apply form: reasons depend on the type
  const typeSel = $('#newType');
  if (keep.newType) typeSel.value = keep.newType;
  if (keep.newDur != null) $('#newDur').value = keep.newDur;
  if (keep.newInternal) $('#newInternal').value = keep.newInternal;
  const buildReason = () => {
    const t = typeSel.value, items = cfg.reasons.apply[t] || [];
    const prev = {code: $('#reasonPick') && $('#reasonPick').value, text: $('#reasonPick-text') && $('#reasonPick-text').value, pub: $('#reasonPick-pub') && $('#reasonPick-pub').value};
    $('#applyReason').innerHTML = reasonFields('reasonPick', items, {label: 'Reason (the player sees this)', publicNote: true});
    const code = prev.code || keep.reasonPick;
    if (code && items.some(i => i.code === code)) $('#reasonPick').value = code;
    $('#reasonPick-text').value = prev.text ?? keep['reasonPick-text'] ?? ''; $('#reasonPick-pub').value = prev.pub ?? keep['reasonPick-pub'] ?? '';
    wireReason('reasonPick');
  };
  const sync = () => {
    const t = typeSel.value; $('#durBox').style.display = t === 'ban' ? 'none' : '';
    $('#blocksPlay').disabled = t !== 'payout_restriction';
    if (t === 'suspension' && !$('#newDur').value) $('#newDur').value = '24';
    buildReason();
  };
  typeSel.onchange = sync; sync();
  $('#days').onchange = e => { window._days = +e.target.value; loadDetail(); };
  $('#copyUid').onclick = () => { navigator.clipboard?.writeText(u.uid); toast('Copied'); };
  $('#bulkOne').onclick = () => { sel.add(u.uid); loadList(); toast('Added. ' + sel.size + ' selected.'); };
  $('#apply').onclick = async () => {
    const type = typeSel.value;
    if (!confirm('Apply ' + TYPE_LABEL[type] + ' to ' + (u.displayName || u.uid) + '?')) return;
    try {
      await post('/admin/api/users/' + u.uid + '/actions', {type, ...readReason('reasonPick'), internalNote: $('#newInternal').value,
        durationHours: type === 'ban' ? null : (+$('#newDur').value || null), blocksPlay: $('#blocksPlay').checked, appealAllowed: $('#appealOk').checked});
      toast('Applied'); await loadDetail(); loadList();
    } catch (e) { toast(e.message, true); }
  };
  $$('[data-lift]').forEach(b => b.onclick = () => liftDialog(u, b.dataset.lift));
  $$('[data-decide]').forEach(b => b.onclick = () => decideDialog(u, b.dataset.id, b.dataset.decide));
}

function liftDialog(u, actionId) {
  const m = modal(`<h3>Lift this action</h3>${reasonFields('liftReason', cfg.reasons.lift, {label: 'Why are you lifting it?'})}
    <label>Probation hours afterwards (blank = default ${cfg.probationHours}, 0 = none)</label><input id="liftProb" type="number" min="0" style="width:100%">
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button id="mCancel">Cancel</button><button class="primary" id="mOk">Lift</button></div>`);
  wireReason('liftReason'); $('#mCancel').onclick = closeModal;
  $('#mOk').onclick = async () => {
    try { await post('/admin/api/users/' + u.uid + '/actions/' + actionId + '/lift', {...readReason('liftReason'), probationHours: $('#liftProb').value === '' ? null : +$('#liftProb').value}); closeModal(); toast('Lifted'); await loadDetail(); loadList(); }
    catch (e) { toast(e.message, true); }
  };
}
function decideDialog(u, id, decision) {
  const items = decision === 'approve' ? cfg.reasons.appealApprove : cfg.reasons.appealReject;
  modal(`<h3>${decision === 'approve' ? 'Approve and lift' : 'Reject the appeal'}</h3>${reasonFields('decReason', items, {label: 'Reply to the player'})}
    ${decision === 'approve' ? `<label>Probation hours afterwards</label><input id="decProb" type="number" min="0" value="${cfg.probationHours}" style="width:100%">` : ''}
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button id="mCancel">Cancel</button><button class="${decision === 'approve' ? 'primary' : 'danger'}" id="mOk">${decision === 'approve' ? 'Approve' : 'Reject'}</button></div>`);
  wireReason('decReason'); $('#mCancel').onclick = closeModal;
  $('#mOk').onclick = async () => {
    try { await post('/admin/api/users/' + u.uid + '/appeals/' + id + '/decide', {decision, ...readReason('decReason'), probationHours: decision === 'approve' && $('#decProb').value !== '' ? +$('#decProb').value : null}); closeModal(); toast('Done'); await loadDetail(); loadList(); }
    catch (e) { toast(e.message, true); }
  };
}

// ---------------------------------------------------------------- bulk
function bulkPanel(ids) {
  mode = 'bulk'; loadList();
  $('#detail').innerHTML = `<div class="card">
    <h2>Bulk action</h2>
    <label>Players (one user id or email per line, up to 200)</label>
    <textarea id="bPlayers" style="min-height:110px" placeholder="uid-1&#10;someone@example.com">${esc(ids.join('\n'))}</textarea>
    <div class="two">
      <div><label>Action</label><select id="bOp" style="width:100%"><option value="apply">Apply an action</option><option value="lift">Lift active actions</option></select></div>
      <div><label>Type</label><select id="bType" style="width:100%"></select></div>
    </div>
    <div id="bDurBox"><label>Duration</label><select id="bDur" style="width:100%"><option value="">Until lifted</option><option value="1">1 hour</option><option value="24">24 hours</option><option value="72">3 days</option><option value="168">7 days</option><option value="720">30 days</option></select></div>
    <div id="bReason"></div>
    <div id="bProbBox" style="display:none"><label>Probation hours afterwards (blank = default ${cfg.probationHours}, 0 = none)</label><input id="bProb" type="number" min="0" style="width:100%"></div>
    <div style="margin-top:12px"><button class="danger" id="bGo">Run</button> <button class="ghost" id="bCancel">Close</button></div>
    <div id="bOut" style="margin-top:14px"></div>
  </div>`;
  const types = Object.keys(TYPE_LABEL);
  const build = () => {
    const op = $('#bOp').value, t = $('#bType').value;
    $('#bType').innerHTML = (op === 'lift' ? '<option value="">Any type</option>' : '') + types.map(x => `<option value="${x}">${TYPE_LABEL[x]}</option>`).join('');
    if (types.includes(t) || op === 'lift') $('#bType').value = t;
  };
  const sync = () => {
    const op = $('#bOp').value, t = $('#bType').value;
    $('#bDurBox').style.display = op === 'apply' && t !== 'ban' ? '' : 'none'; $('#bProbBox').style.display = op === 'lift' ? '' : 'none';
    $('#bReason').innerHTML = reasonFields('bReasonPick', op === 'apply' ? (cfg.reasons.apply[t] || []) : cfg.reasons.lift, {label: op === 'apply' ? 'Reason (every player sees this)' : 'Why are you lifting?', publicNote: op === 'apply'});
    wireReason('bReasonPick');
  };
  $('#bOp').onchange = () => { build(); sync(); }; $('#bType').onchange = sync; build(); sync();
  $('#bCancel').onclick = () => { mode = 'player'; selected ? loadDetail() : $('#detail').innerHTML = '<div class="card empty">Pick a player on the left.</div>'; loadList(); };
  $('#bGo').onclick = async () => {
    const players = $('#bPlayers').value.split(/[\s,;]+/).map(s => s.trim()).filter(Boolean);
    if (!players.length) return toast('Add at least one player', true);
    const op = $('#bOp').value, type = $('#bType').value;
    if (!confirm((op === 'apply' ? 'Apply ' + TYPE_LABEL[type] : 'Lift ' + (type ? TYPE_LABEL[type] : 'all actions')) + ' for ' + players.length + ' player(s)?')) return;
    const body = {op, players, type: type || null, ...readReason('bReasonPick')};
    if (op === 'apply') body.durationHours = type === 'ban' ? null : (+$('#bDur').value || null); else body.probationHours = $('#bProb').value === '' ? null : +$('#bProb').value;
    $('#bGo').disabled = true;
    try {
      const d = await post('/admin/api/bulk', body);
      $('#bOut').innerHTML = `<div class="hint"><b class="okc">${d.done} done</b> · <b class="${d.failed ? 'bad' : ''}">${d.failed} failed</b></div><table><tr><th>Player</th><th>Result</th></tr>${d.results.map(r => `<tr><td>${esc(r.player)}</td><td class="${r.ok ? 'okc' : 'bad'}">${r.ok ? (r.lifted ? 'lifted ' + r.lifted : 'applied') : esc(r.error)}</td></tr>`).join('')}</table>`;
      sel.clear(); loadList();
    } catch (e) { toast(e.message, true); }
    $('#bGo').disabled = false;
  };
}

// ---------------------------------------------------------------- customer service reps
function genPassword() {
  const sets = ['abcdefghijkmnopqrstuvwxyz', 'ABCDEFGHJKLMNPQRSTUVWXYZ', '23456789', '!@#$%&*-_=+'], all = sets.join('');
  const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  const chars = sets.map(s => s[rnd(s.length)]); while (chars.length < 16) chars.push(all[rnd(all.length)]);
  for (let i = chars.length - 1; i > 0; i--) { const j = rnd(i + 1); [chars[i], chars[j]] = [chars[j], chars[i]]; }
  return chars.join('');
}
function repForm(rep) {
  mode = 'team';
  const isNew = !rep;
  $('#detail').innerHTML = `<div class="card">
    <h2>${isNew ? 'New customer service rep' : 'Edit rep'}</h2>
    <div class="hint" style="margin:0 0 8px">Reps sign in at <code>/staff</code> and land on the support site. They can answer tickets and see a player's standing, but can't use this dashboard.</div>
    <div class="two">
      <div><label>Username (4–32 letters, numbers . _ -)</label><input id="rUser" style="width:100%" value="${esc(rep ? rep.username : '')}" ${isNew ? '' : 'disabled'} autocomplete="off"></div>
      <div><label>Display name (players see the first name)</label><input id="rName" style="width:100%" value="${esc(rep ? rep.name : '')}" autocomplete="off"></div>
    </div>
    ${isNew ? `<label>Starting password (they must change it at first sign-in)</label><div style="display:flex;gap:8px"><input id="rPass" style="flex:1" autocomplete="off"><button id="rGen">Generate</button></div>
      <div class="hint">12+ characters with upper, lower, number and symbol. Copy it now: it's never shown again.</div>` : ''}
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      ${isNew ? '<button class="primary" id="rCreate">Create rep</button>' : `<button class="primary" id="rSave">Save name</button><button id="rToggle">${rep.active ? 'Switch off' : 'Switch on'}</button><button id="rReset">Reset password…</button>`}
    </div>
    ${isNew ? '' : `<div class="hint">Created ${fmt(rep.createdAt)} by ${esc(rep.createdBy)}. Switching a rep off or resetting the password signs them out everywhere.</div>`}
    <div id="rOut"></div></div>`;
  if (isNew) {
    $('#rGen').onclick = () => { $('#rPass').value = genPassword(); };
    $('#rCreate').onclick = async () => {
      const username = $('#rUser').value.trim().toLowerCase(), password = $('#rPass').value;
      try {
        await post('/admin/api/staff', {username, name: $('#rName').value, password});
        $('#rOut').innerHTML = `<div class="quote" style="border-color:var(--green);margin-top:12px">Created <b>${esc(username)}</b>. Give them this password now:<br><code style="font-size:14px">${esc(password)}</code> <button class="small" id="rCopy">Copy</button></div>`;
        $('#rCopy').onclick = () => { navigator.clipboard?.writeText(password); toast('Copied'); };
        ['rUser', 'rName', 'rPass'].forEach(i => $('#' + i).value = ''); loadList();
      } catch (e) { toast(e.message, true); }
    };
  } else {
    $('#rSave').onclick = async () => { try { await post('/admin/api/staff/' + rep.username, {name: $('#rName').value}); toast('Saved'); loadList(); } catch (e) { toast(e.message, true); } };
    $('#rToggle').onclick = async () => { try { const r = await post('/admin/api/staff/' + rep.username, {active: !rep.active}); toast(r.active ? 'Switched on' : 'Switched off'); loadList(); repForm(r); } catch (e) { toast(e.message, true); } };
    $('#rReset').onclick = () => {
      modal(`<h3>Reset password for ${esc(rep.username)}</h3><label>New password</label><div style="display:flex;gap:8px"><input id="mPass" style="flex:1" autocomplete="off"><button id="mGen">Generate</button></div>
        <div class="hint">They'll be signed out and must change it at next sign-in.</div>
        <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button id="mCancel">Cancel</button><button class="primary" id="mOk">Reset</button></div>`);
      $('#mGen').onclick = () => { $('#mPass').value = genPassword(); }; $('#mCancel').onclick = closeModal;
      $('#mOk').onclick = async () => {
        const pw = $('#mPass').value;
        try { await post('/admin/api/staff/' + rep.username, {password: pw}); closeModal(); $('#rOut').innerHTML = `<div class="quote" style="border-color:var(--green);margin-top:12px">Password reset. New password:<br><code style="font-size:14px">${esc(pw)}</code></div>`; loadList(); }
        catch (e) { toast(e.message, true); }
      };
    };
  }
}

// ---------------------------------------------------------------- wiring
$$('.tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; $$('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('#searchBar').style.display = tab === 'players' ? '' : 'none'; $('#recentBar').style.display = tab === 'recent' ? '' : 'none'; loadList();
});
$('#connect').onclick = () => connect(false);
$('#key').onkeydown = e => { if (e.key === 'Enter') connect(false); };
$('#signout').onclick = signOut;
$('#lock').onclick = () => { KEY = ''; store.del('adminKey'); showGate(''); };
$('#q').oninput = () => { clearTimeout($('#q').h); $('#q').h = setTimeout(loadList, 250); };
$('#recentDays').onchange = loadList;
setInterval(() => {
  if (!KEY || !$('#live').checked || document.hidden || $('#scrim').style.display === 'flex') return;
  const ae = document.activeElement, typing = ae && ['TEXTAREA', 'INPUT', 'SELECT'].includes(ae.tagName) && ae.id !== 'live';
  if (mode === 'player' && selected && !typing) loadDetail();
  if (!typing && mode !== 'bulk') loadList();
}, 5000);

(async () => {
  if (!TOKEN) return;
  try {
    const me = await api('/admin/api/session');
    $('#who').textContent = me.username; $('#gateWho').textContent = me.username;
    if (!me.dashboardEnabled) return showGate('The server has no ADMIN_KEY set, so the dashboard is off.');
    if (KEY) connect(true); else showGate('');
  } catch (e) { /* api() already redirected if needed */ }
})();
</script>
