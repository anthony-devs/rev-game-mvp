<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>REV Games · Payments</title>
<style>
  :root{--bg:#0b0b0d;--panel:#141417;--panel2:#1b1b1f;--line:#2a2a30;--text:#f2f2f4;--dim:#9a9aa5;--green:#2ee59d;--red:#ff6b6d;--gold:#ffc83d;--blue:#5aa9ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  h1{font-size:16px;margin:0} h1 b{color:var(--gold)}
  input,select,textarea,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  button{cursor:pointer} button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--green);color:#04170f;border-color:var(--green);font-weight:700}
  button.danger{background:var(--red);color:#2a0507;border-color:var(--red);font-weight:700}
  button.ghost{background:transparent} button.small{padding:3px 9px;font-size:12px}
  .spacer{flex:1}
  main{display:grid;grid-template-columns:420px 1fr;gap:16px;padding:16px 18px;max-width:1400px;margin:0 auto}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .tabs{display:flex;gap:6px;margin-bottom:10px} .tabs button{flex:1;padding:6px;font-size:12px}
  .tabs button.on{background:var(--gold);color:#201700;border-color:var(--gold);font-weight:700}
  .row{padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
  .row.sel{border-color:var(--gold)} .n{font-weight:600} .s{color:var(--dim);font-size:12px}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line)}
  .pending_review,.pending,.processing,.created{color:var(--gold);border-color:var(--gold)}
  .paid,.succeeded{color:var(--green);border-color:var(--green)}
  .failed,.rejected,.flagged{color:var(--red);border-color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:13px} td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
  .kv{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px} .kv b{display:block;font-size:16px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;display:none}
  .toast.err{border-color:var(--red);color:var(--red)}
  .warn{background:#2a2205;border:1px solid var(--gold);color:var(--gold);padding:8px 10px;border-radius:10px;margin-bottom:10px;font-size:12px}
  label{display:block;margin:10px 0 4px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>REV <b>Games</b> · Payments</h1>
  <span class="spacer"></span>
  <a href="/admin" style="color:var(--dim)">← Moderation</a>
</header>
<main>
  <section>
    <div class="tabs">
      <button data-t="review" class="on">Needs review</button>
      <button data-t="payouts">All payouts</button>
      <button data-t="deposits">Deposits</button>
    </div>
    <div id="list"></div>
  </section>
  <section class="card" id="detail"><div class="s">Pick a payment on the left.</div></section>
</main>
<div id="toast" class="toast"></div>
<!-- click-guard:start -->
<script>
/* Click guard: a button that starts a change is locked until the answer is back plus a short cool-off,
   and an identical change sent twice while the first is still running is sent only once. */
(function () {
  if (window.__clickGuard) return;
  window.__clickGuard = true;
  var COOL = 1000, WINDOW = 4000, inflight = {}, lastBtn = null, lastClick = 0, realFetch = window.fetch.bind(window);
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button, [role=button], input[type=submit]') : null;
    if (!b) return;
    if (b.getAttribute('data-guard') === '1') { e.preventDefault(); e.stopImmediatePropagation(); return; }
    lastBtn = b; lastClick = Date.now();
  }, true);
  function lock(b) {
    if (!b || !b.isConnected || b.getAttribute('data-guard') === '1') return;
    b.setAttribute('data-guard', '1'); b._wasDisabled = b.disabled; b.disabled = true;
    b.setAttribute('aria-busy', 'true'); b.style.opacity = '.6'; b.style.cursor = 'progress';
  }
  function unlock(b) {
    if (!b || b.getAttribute('data-guard') !== '1') return;
    b.removeAttribute('data-guard'); b.disabled = !!b._wasDisabled; b.removeAttribute('aria-busy'); b.style.opacity = ''; b.style.cursor = '';
  }
  window.fetch = function (input, init) {
    init = init || {};
    var method = String(init.method || (input && input.method) || 'GET').toUpperCase();
    if (method === 'GET' || method === 'HEAD' || method === 'OPTIONS') return realFetch(input, init);
    var url = typeof input === 'string' ? input : (input && input.url) || String(input);
    var key = typeof init.body === 'string' || init.body == null ? method + ' ' + url + ' ' + (init.body || '') : null;
    if (key && inflight[key]) return inflight[key].then(function (r) { return r.clone(); }); // same change already running: share its answer
    var btn = Date.now() - lastClick < WINDOW ? lastBtn : null;
    lock(btn);
    var p = realFetch(input, init), master = null;
    if (key) { master = p.then(function (r) { return r.clone(); }); master.catch(function () {}); inflight[key] = master; }
    var done = function () { setTimeout(function () { if (key && inflight[key] === master) delete inflight[key]; unlock(btn); }, COOL); };
    p.then(done, done);
    return p;
  };
})();
</script>
<!-- click-guard:end -->
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ss = k => { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } };
const TOKEN = ss('staffToken'), KEY = ss('adminKey');
if (!TOKEN || !KEY) location.replace('/admin');   // sign in and connect on the main page first
let tab = 'review', sel = null, CUR = 'NGN', MOCK = false, busy = false;

function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 4000); }
async function api(path, body) {
  const res = await fetch(path, {method: body === undefined ? 'GET' : 'POST', headers: {'Authorization': 'Bearer ' + TOKEN, 'X-Admin-Key': KEY, 'Content-Type': 'application/json'}, body: body === undefined ? undefined : JSON.stringify(body)});
  const d = await res.json().catch(() => ({}));
  if (!res.ok) { if (res.status === 401) location.replace('/admin'); throw new Error(d.message || 'HTTP ' + res.status); }
  return d;
}
const money = n => CUR + ' ' + Number(n).toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2});
const fmt = iso => iso ? new Date(iso).toLocaleString() : '—';
const pill = s => `<span class="pill ${esc(s)}">${esc(s.replaceAll('_', ' '))}</span>`;

async function load() {
  const q = tab === 'review' ? '?kind=payout&status=pending_review' : tab === 'payouts' ? '?kind=payout' : '?kind=deposit';
  const d = await api('/admin/api/payments' + q);
  CUR = d.currency; MOCK = d.mock;
  $('#list').innerHTML = (MOCK ? '<div class="warn">Mock payments: no real money moves. Switch PAYMENTS_MODE before launch.</div>' : '') +
    (d.payments.length ? d.payments.map(p => `<div class="row ${p.id === sel ? 'sel' : ''}" data-id="${p.id}"><div class="n">${money(p.amount)} ${pill(p.status)}</div><div class="s">${esc(p.player)} · ${esc(p.provider)}</div><div class="s">${fmt(p.createdAt)}${p.kind === 'payout' ? ' · ref ' + esc(p.code) : ''}</div></div>`).join('') : '<div class="s">Nothing here.</div>');
  document.querySelectorAll('.row').forEach(r => r.onclick = () => { sel = r.dataset.id; load(); open(sel); });
}

async function open(id) {
  const d = await api('/admin/api/payments/' + id);
  const p = d.payment, u = d.player, isPayout = p.kind === 'payout';
  const dst = p.destination || {};
  $('#detail').innerHTML = `
    <h2 style="margin:0 0 4px">${isPayout ? 'Payout' : 'Deposit'} · ${money(p.amount)} ${pill(p.status)}</h2>
    <div class="s">${esc(p.provider)} · created ${fmt(p.createdAt)} · id ${esc(p.id)}${p.providerRef ? ' · provider ref ' + esc(p.providerRef) : ''}</div>
    <div class="grid">
      <div class="kv">Player<b>${esc(u.name || u.email || u.uid)}</b><span class="s">${esc(u.email || '')}</span></div>
      <div class="kv">Account standing<b>${esc(u.standing)}</b></div>
      <div class="kv">Live balance now<b>${money(u.liveBalance)}</b></div>
      <div class="kv">Deposited (all time)<b>${money(u.totalDeposited)}</b></div>
      <div class="kv">Paid out (all time)<b>${money(u.totalPaidOut)}</b></div>
      <div class="kv">Live rounds played<b>${u.liveRounds}</b></div>
    </div>
    ${isPayout ? `<div class="kv" style="margin-bottom:10px">Send to<b>${esc(dst.accountName)}</b><span class="s">${esc(dst.bankName)} · ${esc(dst.accountNumber)}</span></div>` : ''}
    <h3 style="font-size:12px;color:var(--dim);letter-spacing:1px;text-transform:uppercase">Recent live rounds</h3>
    ${u.recentRounds.length ? `<table><tr><th>Game</th><th>Bet</th><th>Returned</th><th>When</th></tr>${u.recentRounds.map(r => `<tr><td>${esc(r.game)}</td><td>${esc(r.bet)}</td><td>${esc(r.payout)}</td><td>${fmt(r.at)}</td></tr>`).join('')}</table>` : '<div class="s">No live rounds yet. Money in, nothing played: check why they want out.</div>'}
    <h3 style="font-size:12px;color:var(--dim);letter-spacing:1px;text-transform:uppercase">History</h3>
    <table>${p.history.map(h => `<tr><td>${fmt(h.at)}</td><td>${esc(h.status)}</td><td>${esc(h.by)}</td><td>${esc(h.note)}</td></tr>`).join('')}</table>
    <div id="actions" style="margin-top:14px"></div>`;
  actions(p);
}

function actions(p) {
  const box = $('#actions');
  if (p.kind === 'deposit') {
    box.innerHTML = ['created', 'pending'].includes(p.status) ? '<button id="vf">Check with provider</button>' : '';
    if ($('#vf')) $('#vf').onclick = () => run(`/admin/api/payments/${p.id}/verify`, {}, 'Checked');
    return;
  }
  if (p.status === 'pending_review') {
    box.innerHTML = `
      <div class="warn">Check the player's history above and the destination account. Approving sends real money and can't be undone.</div>
      <label>Type this payout's reference <b style="color:var(--gold)">${esc(p.code)}</b> to approve it</label>
      <input id="conf" autocomplete="off" style="width:100%;text-transform:uppercase" placeholder="${esc(p.code)}">
      <label>Note (optional)</label><input id="note" style="width:100%">
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="primary" id="ok" disabled>Approve and send</button>
        <button class="danger" id="no">Reject and refund…</button></div>`;
    const conf = $('#conf'), ok = $('#ok');
    conf.oninput = () => ok.disabled = conf.value.trim().toUpperCase() !== p.code;
    ok.onclick = () => run(`/admin/api/payments/${p.id}/approve`, {confirm: conf.value, note: $('#note').value}, 'Approved');
    $('#no').onclick = () => { const r = prompt('Reason for rejecting (shown to the player):'); if (r) run(`/admin/api/payments/${p.id}/reject`, {reason: r}, 'Rejected, funds returned'); };
  } else if (p.status === 'processing') {
    box.innerHTML = '<button id="sync">Check status with provider</button> <button id="retry" class="ghost">Retry sending</button>';
    $('#sync').onclick = () => run(`/admin/api/payments/${p.id}/sync`, {}, 'Synced');
    $('#retry').onclick = () => run(`/admin/api/payments/${p.id}/retry`, {}, 'Retried');
  } else if (p.status === 'failed') {
    box.innerHTML = '<div class="warn">The provider could not send this. The money is still held.</div><button id="retry">Retry sending</button> <button id="no" class="danger">Reject and refund…</button>';
    $('#retry').onclick = () => run(`/admin/api/payments/${p.id}/retry`, {}, 'Retried');
    $('#no').onclick = () => { const r = prompt('Reason for rejecting:'); if (r) run(`/admin/api/payments/${p.id}/reject`, {reason: r}, 'Rejected, funds returned'); };
  } else box.innerHTML = '';
}

async function run(path, body, done) {
  if (busy) return; busy = true;
  document.querySelectorAll('#actions button').forEach(b => b.disabled = true);   // one click, one request
  try { await api(path, body); toast(done); } catch (e) { toast(e.message, true); }
  busy = false; await load(); if (sel) open(sel);
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); sel = null; $('#detail').innerHTML = '<div class="s">Pick a payment on the left.</div>'; load(); });
load().catch(e => toast(e.message, true));
setInterval(() => { if (!busy && !document.hidden) load().catch(() => {}); }, 60000);
</script>
</body>
</html>
